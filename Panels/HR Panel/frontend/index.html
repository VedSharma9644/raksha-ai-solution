<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Raskha HR Panel</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("raskha.uiTheme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";

          var raw = localStorage.getItem("raskha.uiAppearance");
          if (raw) {
            var appearance = JSON.parse(raw);
            if (appearance && appearance.primary) {
              document.documentElement.style.setProperty(
                "--color-primary",
                appearance.primary
              );
              document.documentElement.style.setProperty(
                "--color-focus",
                appearance.primary
              );
            }
            if (appearance && appearance.secondary) {
              document.documentElement.style.setProperty(
                "--color-secondary",
                appearance.secondary
              );
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
